[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aki-engine"
version = "0.1.0"
description = "Provenance-first multimodal ancient knowledge research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "11vatedTech" }]
dependencies = []

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24"]
room = [
    "fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3",
    "model2vec>=0.4", "PyMuPDF>=1.24",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "PyMuPDF>=1.24", "httpx>=0.27"]

[project.scripts]
aki = "aki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aki = ["app/memorial.json", "app/notes.json", "app/static/*", "app/static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
